# Workflow build APK — dibuat otomatis oleh APK Builder.
# Dijalankan di GitHub Actions setiap kali workflow ini di-dispatch
# (workflow_dispatch) oleh Pages Worker. Menghasilkan APK debug
# (debug-signed, siap install untuk testing) sebagai artifact
# bernama `apk` — BUKAN APK release; signing release adalah
# langkah lanjutan (lihat docs/build-flow.md).
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
